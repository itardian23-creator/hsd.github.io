const AUTH={admin:'6b86b273ff34fce19d6b804eff5a3f5747ada4eaa22f1d49c01e52ddb7875b4b'};
const sha=async s=>{if(!(window.crypto&&crypto.subtle))throw 0;const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')};
async function uh(u,p){return sha('hsims:'+u+':'+p)}
const authed=()=>{try{return sessionStorage.getItem('hsims-auth')||localStorage.getItem('hsims-auth')}catch(e){return null}};
function lock(on){document.body.classList.toggle('locked',on);$('#login').hidden=!on;if(on)setTimeout(()=>{const u=$('#lu');u&&u.focus&&u.focus()},50)}
async function doLogin(){const u=$('#lu').value.trim().toLowerCase(),p=$('#lp').value;let ok=false;
 try{const us=(S.users||{})[u];ok=us&&us.h?us.h===await uh(u,p):!!AUTH[u]&&AUTH[u]===await sha(p)}catch(e){$('#le').textContent='Peramban tidak mendukung login (butuh HTTPS).';return}
 if(ok){try{($('#lr').checked?localStorage:sessionStorage).setItem('hsims-auth',u)}catch(e){}$('#lp').value='';$('#le').textContent='';lock(false);draw()}
 else{$('#le').textContent='Username atau password salah';$('#lp').value=''}}

let akunEdit=null;
const menuNames=m=>!Array.isArray(m)?'Semua menu':m.length?m.map(k=>(MENUS.find(x=>x[0]==k)||[0,k])[1]).join(', '):'(tidak ada)';
const menuBoxes=(pre,sel)=>`<div style="display:flex;flex-wrap:wrap;gap:6px 16px">${MENUS.map(([k,n])=>`<label class="sub" style="display:flex;gap:6px;align-items:center;margin:0"><input type="checkbox" data-mn="${pre}" value="${k}" ${!Array.isArray(sel)||sel.includes(k)?'checked':''}> ${esc(n)}</label>`).join('')}</div>`;
const pickedMenus=pre=>[...document.querySelectorAll('[data-mn="'+pre+'"]:checked')].map(x=>x.value);
function userCard(){const us=S.users||{},me=authed(),rows=['admin',...Object.keys(us).filter(k=>k!='admin')].map(u=>{const r=u=='admin'?'admin':us[u].r;
  const main=`<tr><td>${esc(u)}${u==me?' <span class="sub">(Anda)</span>':''}</td><td><span class="pill">${r=='admin'?'Admin':'Petugas'}</span></td><td style="white-space:normal;min-width:160px">${r=='admin'?'Semua menu':esc(menuNames(us[u].m))}</td><td><button class="btn sm" data-ua="pw" data-u="${esc(u)}">Ganti password</button>${r!='admin'?` <button class="btn sm" data-ua="menu" data-u="${esc(u)}">Atur menu</button>`:''}${u!='admin'&&u!=me?` <button class="btn sm" data-ua="role" data-u="${esc(u)}">Jadikan ${r=='admin'?'Petugas':'Admin'}</button>`:''}${u!='admin'&&u!=me?` <button class="btn sm" data-ua="del" data-u="${esc(u)}">Hapus</button>`:''}</td></tr>`;
  const ed=akunEdit==u&&r!='admin'?`<tr><td colspan="4" style="white-space:normal"><p class="sub" style="margin:0 0 8px"><b>Menu yang bisa dilihat ${esc(u)}</b></p>${menuBoxes('edit',us[u].m)}<p style="margin:10px 0 0"><button class="btn acc sm" data-ua="mens" data-u="${esc(u)}">Simpan menu</button> <button class="btn sm" data-ua="menuc">Batal</button></p></td></tr>`:'';
  return main+ed}).join('');
 return`<div class="card"><h2>Kelola akun</h2><p class="sub"><b>Admin</b>: melihat semua menu, mengatur rencana, menambah/menghentikan pekerjaan, dan kelola akun. <b>Petugas</b>: hanya melihat menu yang dicentang untuk akunnya, dan hanya mengisi realisasi (tanggal & foto). Akun ikut tersinkron ke semua perangkat.</p>
${us.admin&&us.admin.h?'':'<p class="sub" style="color:var(--bad);font-weight:700">Password admin masih bawaan. Ketuk "Ganti password" pada admin sekarang.</p>'}
<div class="tw"><table><tr><th>Username</th><th>Peran</th><th>Menu</th><th></th></tr>${rows}</table></div>

<div id="umw" style="margin-top:10px"><p class="sub" style="margin:0 0 8px"><b>Menu yang bisa dilihat</b> (khusus Petugas)</p>${menuBoxes('new',null)}</div>

document.addEventListener('click',async e=>{const b=e.target.closest('[data-ua]');if(!b||!isAdmin())return;const a=b.dataset.ua,u=b.dataset.u;S.users=S.users||{};
 if(a=='add'){const n=$('#uu').value.trim().toLowerCase(),p=$('#up').value,r=$('#ur').value;
  if(!/^[a-z0-9._-]{3,20}$/.test(n))return toast('Username 3–20 karakter: huruf kecil, angka, titik, - atau _');
  if(p.length<6)return toast('Password minimal 6 karakter');
  if(n=='admin'||S.users[n])return toast('Username sudah dipakai');
  const m=pickedMenus('new');if(r=='petugas'&&!m.length)return toast('Pilih minimal 1 menu untuk petugas');S.users[n]=r=='admin'?{h:await uh(n,p),r}:{h:await uh(n,p),r,m};save();draw();toast('Akun '+n+' ditambahkan')}
 if(a=='menu'){akunEdit=u;draw();return}
 if(a=='menuc'){akunEdit=null;draw();return}
 if(a=='mens'&&S.users[u]){const m=pickedMenus('edit');if(!m.length)return toast('Pilih minimal 1 menu');S.users[u].m=m;akunEdit=null;save();draw();toast('Menu '+u+' diperbarui')}
 if(a=='pw'){const p=prompt('Password baru untuk '+u+' (min. 6 karakter):');if(!p)return;if(p.length<6)return toast('Minimal 6 karakter');
  S.users[u]=Object.assign(S.users[u]||{r:'admin'},{h:await uh(u,p)});save();draw();toast('Password '+u+' diganti')}
 if(a=='role'&&u!='admin'&&u!=authed()&&S.users[u]){const r=S.users[u].r=='admin'?'petugas':'admin';if(!confirm('Ubah peran '+u+' menjadi '+(r=='admin'?'Admin':'Petugas')+'?'))return;S.users[u].r=r;save();draw();toast('Peran '+u+' sekarang '+(r=='admin'?'Admin':'Petugas'))}
 if(a=='del'&&u!='admin'&&u!=authed()&&confirm('Hapus akun '+u+'?')){delete S.users[u];save();draw();toast('Akun dihapus')}});

(function(){const btn=$('#menuBtn'),menu=$('#mmenu');if(!btn||!menu)return;
 let bk=document.getElementById('mback');if(!bk){bk=document.createElement('div');bk.id='mback';document.body.appendChild(bk)}
